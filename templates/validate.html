{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3>Validate Vidya Cipher Number</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('validate') }}">
                    <div class="mb-3">
                        <label for="base_number" class="form-label">Base Number</label>
                        <input type="text" class="form-control" id="base_number" name="base_number" required>
                    </div>
                    <div class="mb-3">
                        <label for="ciphertext_hex" class="form-label">Vidya Cipher Number</label>
                        <input type="text" class="form-control" id="ciphertext_hex" name="ciphertext_hex" required>
                    </div>
                    <button type="submit" class="btn btn-success">Validate</button>
                </form>
                
                {% if validation_result %}
                <div class="mt-4">
                    <h4>Validation Result:</h4>
                    <div class="alert {% if 'successful' in validation_result %}alert-success{% else %}alert-danger{% endif %}">
                        {{ validation_result }}
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
